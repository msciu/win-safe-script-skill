name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows script encoding self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境概览
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          [Console]::OutputEncoding.WebName
          (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          (Get-Command node.exe -ErrorAction SilentlyContinue).Source
          .\scripts\Invoke-SafeScript.ps1 -Check

      - name: 自测（Windows PowerShell 5.1）
        shell: powershell
        run: .\scripts\Test-SafeScript.ps1

      - name: 自测（PowerShell 7）
        shell: pwsh
        run: .\scripts\Test-SafeScript.ps1
